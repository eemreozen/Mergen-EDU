[project]
name = "mergen-backend"
version = "0.1.0"
description = "Mergen adaptif öğrenme platformu backend servisi"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<3",
  "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "openai>=2,<3", "google-genai>=1.50,<3", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "jsonschema>=4.23,<5", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: gerçek sağlayıcı ve API anahtarı gerektirir"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
